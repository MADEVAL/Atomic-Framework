name: Sync Skeleton

on:
  push:
    tags: ['*']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync skeleton to application repo
        env:
          TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'

          TARGET_REPO="https://x-access-token:${TOKEN}@github.com/MADEVAL/Atomic-Framework-Application.git"
          WORKDIR="/tmp/skeleton-sync"

          git clone "$TARGET_REPO" "$WORKDIR"
          find "$WORKDIR" -mindepth 1 -not -name '.git' -delete
          cp -r packages/skeleton/* "$WORKDIR/"
          cp packages/skeleton/.env.example "$WORKDIR/" 2>/dev/null || true

          cd "$WORKDIR"
          git add -A
          git commit -m "Sync from monorepo ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git tag -f "${GITHUB_REF_NAME}"
          git push origin main --tags
