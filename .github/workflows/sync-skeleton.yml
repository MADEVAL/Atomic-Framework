name: Sync Skeleton on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout framework repo
        uses: actions/checkout@v4

      - name: Get GH token from Windows Credential Manager
        shell: pwsh
        run: |
          $token = (& {
            "protocol=https`nhost=github.com" | git credential-manager get 2>$null
          } | Where-Object { $_ -match 'password=' } | ForEach-Object { $_ -replace 'password=', '' })

          if (-not $token) {
            Write-Error "Failed to get token from Windows Credential Manager. Make sure 'git credential-manager' is installed and authenticated."
            exit 1
          }

          "GH_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone skeleton repo
        shell: pwsh
        run: |
          git clone https://github.com/MADEVAL/Atomic-Framework-Application.git "${{ runner.temp }}\skeleton"

      - name: Sync skeleton files
        shell: pwsh
        run: |
          $skeleton = "${{ runner.temp }}\skeleton"
          $source = "packages\skeleton"

          Remove-Item -LiteralPath "$skeleton\.git" -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem -LiteralPath $skeleton -Exclude '.git' | Remove-Item -Recurse -Force

          Copy-Item -LiteralPath "$source\*" -Destination $skeleton -Recurse -Force

      - name: Commit and push
        shell: pwsh
        run: |
          $skeleton = "${{ runner.temp }}\skeleton"
          $tag = "${{ github.ref_name }}"
          Set-Location -LiteralPath $skeleton

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/MADEVAL/Atomic-Framework-Application.git"

          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Sync $tag"
          }

          git tag -f $tag
          git push origin main --tags --force-with-lease
