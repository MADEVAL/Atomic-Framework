name: Sync Skeleton on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework repo
        uses: actions/checkout@v4

      - name: Clone skeleton repo
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/MADEVAL/Atomic-Framework-Application.git" \
            /tmp/skeleton

      - name: Sync skeleton files
        run: |
          cd /tmp/skeleton
          git rm -r --quiet . 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/packages/skeleton/* .
          cp $GITHUB_WORKSPACE/packages/skeleton/.env.example . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/packages/skeleton/.gitignore . 2>/dev/null || true

      - name: Commit and push
        run: |
          cd /tmp/skeleton
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          git commit -m "Sync ${{ github.ref_name }}"

          git tag -f "${{ github.ref_name }}"
          git push origin main --tags
