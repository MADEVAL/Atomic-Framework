name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atomic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis, sodium, mbstring, fileinfo, curl, json, session, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Setup test database
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE USER IF NOT EXISTS 'atomic_test_user'@'%' IDENTIFIED BY 'atomic_test_pass';"
          mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON atomic_test.* TO 'atomic_test_user'@'%'; FLUSH PRIVILEGES;"

      - name: Run tests
        run: php vendor/bin/phpunit --no-extensions
